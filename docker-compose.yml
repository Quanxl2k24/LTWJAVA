services:
  mysql:
    image: mysql:8.0
    container_name: ltwjava-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ltwjava_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ltwjava-network

  redis:
    image: redis:7-alpine
    container_name: ltwjava-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD}" ]; then
          redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ltwjava-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  ltwjava-network:
    driver: bridge
